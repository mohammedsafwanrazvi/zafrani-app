name: Build Android
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: |
          npx cap add android
          cp -rf android-overrides/. android/
          rm -f android/app/src/main/res/values/ic_launcher_background.xml

          npx cap sync android
      - name: Allow images and cookies in the app
        run: |
          sed -i '0,/<application/s//<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Restore permanent signing key
        uses: actions/cache@v4
        with:
          path: android/app/release.jks
          key: permanent-android-signing-key
      - name: Create signing key
        run: |
          if [ ! -f android/app/release.jks ]; then
            keytool -genkeypair -v -keystore android/app/release.jks -alias "${{ secrets.SIGNING_ALIAS }}"               -keyalg RSA -keysize 2048 -validity 9125               -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" -keypass "${{ secrets.SIGNING_STORE_PASSWORD }}" -dname "CN=Zafrani, O=Zafrani, C=IN"
          fi
          keytool -list -v -keystore android/app/release.jks -alias "${{ secrets.SIGNING_ALIAS }}" -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" | grep SHA256 || true
      - name: Build APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.SIGNING_STORE_PASSWORD }}"             -Pandroid.injected.signing.key.alias="${{ secrets.SIGNING_ALIAS }}"             -Pandroid.injected.signing.key.password="${{ secrets.SIGNING_STORE_PASSWORD }}"
      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/Zafrani.apk"
          cp android/app/build/outputs/bundle/release/*.aab "out/Zafrani.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: out/*
      - name: Publish download links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Zafrani 1.0.0
          files: out/*
